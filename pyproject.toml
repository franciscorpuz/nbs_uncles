[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"


[project]
name = "nbs_uncles"
version = "0.0.2.3"
authors = [
    { name = "Francis Corpuz, Elias Adediran, Glen Rice", email = "franciscorpuz@yahoo.com" },
    { name = "Elias Adediran", email = "eliasadediran@gmail.com" },
    { name = "Glen Rice", email = "glen.rice@noaa.gov" },
]
description = "Python Codes for UNCertainty EStimation Library"
requires-python = "<3.13"
dependencies = [
    "gdal<=3.11",
    "matplotlib",
    "numpy",
    "pillow",
    "notebook",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "tqdm",
]
readme = "README.md"
license = "CC0-1.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Oceanography",
]

[project.urls]
Homepage = "https://nauticalcharts.noaa.gov/learn/nbs.html"
Documentation = "https://nbs_uncles.readthedocs.io/"

[dependency-groups]
dev = [
    "pytest"
]

